title: Stratified Analysis (R×C×K)
name: chisqstrataRxC
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Row Variable
        children:
          - type: VariablesListBox
            name: rows
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Column Variable
        children:
          - type: VariablesListBox
            name: cols
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Stratifying Variable
        children:
          - type: VariablesListBox
            name: strata
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Counts (optional)
        children:
          - type: VariablesListBox
            name: counts
            maxItemCount: 1
            isTarget: true
  
  - type: CollapseBox
    label: Bootstrap Settings
    collapsed: true
    stretchFactor: 1
    children:
      - type: TextBox
        name: nBootstrap
        format: number
      - type: TextBox
        name: seed
        format: number
  - type: CollapseBox
    label: Visual Summaries
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showForestPlot
      - type: CheckBox
        name: strataOrdered
      - type: CheckBox
        name: showTrajectoryPlot
        enable: (strataOrdered)
        style: list-inline
      - type: CheckBox
        name: showDiagnosticTree
  - type: CollapseBox
    label: Display Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showMethodInfo
