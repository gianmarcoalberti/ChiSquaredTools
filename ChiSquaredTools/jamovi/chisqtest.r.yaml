---
name: chisqtest
title: Chi-Squared Test of Independence
jrs: '1.1'
items:
    - name: crosstabTable
      title: Observed Contingency Table
      type: Table
      clearWith:
        - rows
        - cols
        - counts
      columns: []

    - name: expectedTable
      title: Expected Frequencies
      type: Table
      clearWith:
        - rows
        - cols
        - counts
      columns: []

    - name: tableCharacteristics
      title: Table Characteristics
      type: Table
      rows: 0
      clearWith:
        - rows
        - cols
        - counts
      columns:
        - name: characteristic
          title: 'Characteristic'
          type: text
        - name: value
          title: 'Value'
          type: text
      refs:
       - alberti2024
       - rhoades1982
       - roscoe1971
       - zar2014
    - name: validityAssessment
      title: Test Validity Assessment
      type: Table
      rows: 0
      clearWith:
        - rows
        - cols
        - counts
      columns:
        - name: diagnostic
          title: 'Diagnostic'
          type: text
        - name: value
          title: 'Value'
          type: text
        - name: threshold
          title: 'Threshold'
          type: text
        - name: status
          title: 'Status'
          type: text
      refs:
       - alberti2024
       - koehler1980
       - roscoe1971
       - zar2014

    - name: testResults
      title: Test Results
      type: Table
      clearWith:
        - rows
        - cols
        - counts
        - nPerms
        - seed
        - mTest
      columns:
        - name: method
          title: 'Method'
          type: text
        - name: statistic
          title: 'χ²'
          type: number
        - name: df
          title: 'df'
          type: integer
        - name: mstat
          title: 'M'
          type: number
        - name: pvalue
          title: 'p'
          type: number
          format: zto,pvalue
      refs:
       - alberti2024
       - campbell2007
       - fuchs1980
       - lin2015
       - agresti2022
       - greenwood1996
       - howell2011
       - phipson2010
       - richardson2011
       - upton1982
       - utts2014

    - name: permDistPlot
      title: Permutation Test Distribution
      type: Image
      visible: (showDistributions && permTest)
      width: 500
      height: 400
      renderFun: .plotPermDist
      clearWith:
        - rows
        - cols
        - counts
        - nPerms
        - seed

    - name: mcDistPlot
      title: Monte Carlo Test Distribution
      type: Image
      visible: (showDistributions && monteCarloTest)
      width: 500
      height: 400
      renderFun: .plotMCDist
      clearWith:
        - rows
        - cols
        - counts
        - nPerms
        - seed

    - name: methodInfo
      title: Method Details
      type: Html
      visible: (showMethodInfo)
      clearWith:
        - rows
        - cols
        - traditionalTest
        - n1Test
        - permTest
        - monteCarloTest
...
