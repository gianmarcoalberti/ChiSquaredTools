title: Chi-Squared Test of Independence
name: chisqtest
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Row Variable
        children:
          - type: VariablesListBox
            name: rows
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Column Variable
        children:
          - type: VariablesListBox
            name: cols
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Counts (optional)
        children:
          - type: VariablesListBox
            name: counts
            maxItemCount: 1
            isTarget: true
  
  # --- GROUP: Test Methods ---
  - type: CollapseBox
    label: Test Methods
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: traditionalTest
      - type: CheckBox
        name: n1Test
      - type: CheckBox
        name: permTest
      - type: CheckBox
        name: monteCarloTest
      - type: CheckBox
        name: mTest
  
  # --- Computation Parameters (used by the resampling tests only) ---
  - type: CollapseBox
    label: Resampling Settings
    collapsed: true
    stretchFactor: 1
    children:
      - type: TextBox
        name: nPerms
        format: number
        enable: (permTest || monteCarloTest)
      - type: TextBox
        name: seed
        format: number
        enable: (permTest || monteCarloTest)
  
  # --- GROUP: Cells (percentages in the observed table) ---
  - type: CollapseBox
    label: Cells
    collapsed: true
    stretchFactor: 1
    children:
      - type: Label
        label: Percentages
        children:
          - type: CheckBox
            name: pctRow
          - type: CheckBox
            name: pctCol
          - type: CheckBox
            name: pctTotal
  
  # --- GROUP: Display Options ---
  - type: CollapseBox
    label: Display Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showDistributions
        enable: (permTest || monteCarloTest)
      - type: CheckBox
        name: showMethodInfo
