title: Stratified Analysis (2×2×K)
name: chisqstrata2x2
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Row Variable
        children:
          - type: VariablesListBox
            name: rows
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Column Variable
        children:
          - type: VariablesListBox
            name: cols
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Stratifying Variable
        children:
          - type: VariablesListBox
            name: strata
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Counts (optional)
        children:
          - type: VariablesListBox
            name: counts
            maxItemCount: 1
            isTarget: true
  
  - type: CollapseBox
    label: Odds Ratio Options
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: normal
        children:
          - type: LevelSelector
            name: rowRef
            label: Row category of interest
            enable: (rows)
      - type: LayoutBox
        margin: normal
        children:
          - type: LevelSelector
            name: colRef
            label: Column category of interest
            enable: (cols)
  - type: CollapseBox
    label: Visual Summaries
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showForestPlot
      - type: CheckBox
        name: strataOrdered
      - type: CheckBox
        name: showTrajectoryPlot
        enable: (strataOrdered)
        style: list-inline
  - type: CollapseBox
    label: Display Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showMethodInfo
