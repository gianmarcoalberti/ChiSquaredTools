---
name: chisqcluster
title: Contingency Table Row/Column Clustering
menuGroup: Chi² Tools
menuTitle: Row/Column Clustering
version: '1.0.0'
jas: '1.2'
description:
    main: |
        Hierarchical clustering analysis for contingency table rows and columns 
        using the Greenacre (2017) critical-value method or the Husson et al. (2017)
        inertia gain ratio.
        
        Provides:
        - Agglomerative clustering with Ward linkage criterion
        - Critical chi-squared values for optimal cluster identification
        - Cluster dendrograms with significance cutoff lines
        - Detailed merging sequence statistics
        - Identified significant row and column groups
        
        The method uses chi-squared distance to identify homogeneous groups of rows 
        (or columns) that can be merged without significantly reducing the table's 
        association. Merging continues as long as the chi-squared reduction caused 
        by each merge stays below a critical value adjusted for multiple 
        comparisons (Greenacre 2017, Exhibit A.1, p.254).
        
    R:
        dontrun: false
        usage: |
            # Example with aggregated data (one row per cell plus a counts column)
            data <- data.frame(
              Store = rep(c("A", "B", "C", "D", "E"), times = 4),
              AgeGroup = rep(c("16-24", "25-34", "35-49", "50+"), each = 5),
              Count = c(37, 13, 33, 16, 8,  39, 23, 69, 31, 16,
                        45, 33, 67, 34, 21, 64, 38, 56, 22, 35)
            )
            
            ChiSquaredTools::chisqcluster(
                data = data,
                rows = 'Store',
                cols = 'AgeGroup',
                counts = 'Count',
                plotRowDendro = TRUE,
                plotColDendro = TRUE
            )

completeWhenFilled: false

options:
    - name: data
      type: Data
      description:
          R: the data as a data frame

    - name: rows
      title: Row Variable
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      description:
          R: >
            a string naming the variable for rows in the contingency table
            (must be a factor)

    - name: cols
      title: Column Variable
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      description:
          R: >
            a string naming the variable for columns in the contingency table
            (must be a factor)

    - name: counts
      title: Counts (optional)
      type: Variable
      suggested:
        - continuous
      description:
          R: >
            optional variable containing frequency counts for wide-format data.
            If not provided, data are assumed to be in long format (one row per case).

    - name: plotRowDendro
      title: Row dendrogram
      type: Bool
      default: false
      description:
          R: >
            TRUE or FALSE (default), display hierarchical clustering dendrogram 
            for table rows with the partition cut-off line

    - name: plotColDendro
      title: Column dendrogram
      type: Bool
      default: false
      description:
          R: >
            TRUE or FALSE (default), display hierarchical clustering dendrogram 
            for table columns with the partition cut-off line

    - name: showMethodInfo
      title: Method explanations
      type: Bool
      default: false
      description:
          R: >
            TRUE or FALSE (default), display detailed methodological 
            explanations for the clustering procedure

    - name: partitionMethod
      title: Partition selection method
      type: List
      options:
        - name: greenacre
          title: Critical chi-squared (Greenacre, 2017)
        - name: inertia
          title: Inertia gain ratio (Husson et al., 2017)
      default: greenacre
      description:
          R: >
            Method for selecting the optimal partition. 'greenacre' uses 
            critical chi-squared values from Pearson & Hartley (1972) to 
            identify statistically significant groupings. 'inertia' uses 
            the relative drop in between-cluster inertia gain to find 
            the "elbow" in the clustering hierarchy (Husson et al., 2017).
...
