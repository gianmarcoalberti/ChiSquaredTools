title: Chi-Squared Post-Hoc Analysis
name: chisqposthoc
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Row Variable
        children:
          - type: VariablesListBox
            name: rows
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Column Variable
        children:
          - type: VariablesListBox
            name: cols
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Counts (optional)
        children:
          - type: VariablesListBox
            name: counts
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Symmetric Measures
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: stdres
      - type: CheckBox
        name: momcorrstdres
      - type: CheckBox
        name: adjstdres
      - type: CheckBox
        name: quetelet
      - type: CheckBox
        name: ij
      - type: CheckBox
        name: bsOutlier
      - type: CheckBox
        name: pem
      - type: CheckBox
        name: medpolish
      - type: CheckBox
        name: adjmedpolish
  - type: CollapseBox
    label: Directional Measures
    collapsed: false
    stretchFactor: 1
    children:
      - type: CheckBox
        name: gkres
      - type: CheckBox
        name: dep
  - type: CollapseBox
    label: Adjustment for Multiple Comparisons
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: sidakCorrection
        enable: (stdres || momcorrstdres || adjstdres)
  - type: CollapseBox
    label: Backwards-Stepping Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: TextBox
        name: bsKmax
        format: number
        enable: (bsOutlier)
  - type: CollapseBox
    label: PEM Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: TextBox
        name: confLevel
        format: number
        suffix: '%'
        enable: (pem)
      - type: TextBox
        name: bootstrapReps
        format: number
        enable: (pem)
      - type: TextBox
        name: seed
        format: number
        enable: (pem)
      - type: CheckBox
        name: showPemPlot
        enable: (pem)
      - type: ComboBox
        name: pemPlotFilter
        enable: (pem && showPemPlot)
  - type: CollapseBox
    label: DEP Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: LevelSelector
        name: depOutcome
        enable: (dep)
      - type: CheckBox
        name: showDepPlot
        enable: (dep)
  - type: CollapseBox
    label: Display Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: showMethodInfo
